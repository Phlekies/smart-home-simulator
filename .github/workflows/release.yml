name: Release

# Pushing a tag such as v2.0.0 builds the interface, packages the local app as a zip that only needs
# Python (scripts/package_local.py) and publishes it as a GitHub release with its CHANGELOG notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the interface and the zip
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/package_local.py --output dist --name "SmartHomeSimulator-${GITHUB_REF_NAME#v}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes: the CHANGELOG section of this version.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Download and run
          Unzip `SmartHomeSimulator-*.zip` and run `python scripts/start.py` (Python 3.11 or later; Node is
          not needed). The first run creates a local virtual environment with the pinned dependencies; the
          app then opens on http://127.0.0.1:8000/ and listens on this computer only.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Smart Home Simulator ${VERSION}" --notes-file notes.md
