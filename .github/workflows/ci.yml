name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the pinned Python dependencies
        run: |
          python -m pip install -r services/simulator/requirements-dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e services/simulator

      - name: Test the simulator, contracts and API
        run: python -m pytest services/simulator/tests -q

      - name: Check JSON Schema / OpenAPI drift
        if: runner.os == 'Linux'
        run: python scripts/export_contracts.py --check

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Check generated TypeScript drift
        if: runner.os == 'Linux'
        run: |
          npm run contracts --prefix apps/web
          git diff --exit-code -- apps/web/src/generated

      - name: Type-check and build the interface
        run: npm run build --prefix apps/web

      - name: Test the editor
        run: npm test --prefix apps/web

      - name: Package the Python-only local app
        run: python scripts/package_local.py --output "$RUNNER_TEMP/local-app"
