name: Migration contracts and application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install tested Python dependencies
        run: |
          python -m pip install -r services/simulator/requirements-dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e services/simulator
      - name: Test contracts, importer, baseline and API
        run: python -m pytest services/simulator/tests -q
      - name: Check Python contract drift
        run: python scripts/export_contracts.py --check
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Check generated TypeScript drift
        run: |
          npm run contracts
          git diff --exit-code -- src/generated
        working-directory: apps/web
      - name: Build web application
        run: npm run build
        working-directory: apps/web
      - name: Test editor geometry and undo history
        run: npm test
        working-directory: apps/web
